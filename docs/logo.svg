<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradRed" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1214"/>
      <stop offset="100%" stop-color="#0D090A"/>
    </linearGradient>
    <linearGradient id="crimsonArc" x1="44" y1="44" x2="212" y2="212" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
  </defs>

  <!-- App Squircle Container -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGradRed)" stroke="#381D21" stroke-width="4"/>

  <!-- Background Ring Track -->
  <circle cx="128" cy="128" r="82" stroke="#362225" stroke-width="14"/>

  <!-- 20% Critical Arc -->
  <path d="M128 46 A82 82 0 0 1 206 153" stroke="url(#crimsonArc)" stroke-width="14" stroke-linecap="round"/>

  <!-- Battery Cap -->
  <rect x="114" y="76" width="28" height="10" rx="4" fill="#FFCCBC"/>

  <!-- Battery Body -->
  <rect x="94" y="88" width="68" height="86" rx="14" fill="#241417" stroke="#FF5252" stroke-width="4"/>

  <!-- Exclamation Indicator -->
  <rect x="124" y="104" width="8" height="28" rx="4" fill="#FFFFFF"/>
  <circle cx="128" cy="142" r="4.5" fill="#FFFFFF"/>

  <!-- Low 20% Red Bar -->
  <rect x="104" y="154" width="48" height="11" rx="5" fill="url(#crimsonArc)"/>
</svg>
